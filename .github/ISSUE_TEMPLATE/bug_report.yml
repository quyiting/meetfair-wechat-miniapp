name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与日志
      description: 请先删除地图密钥、OpenID、房间码和精确住址。
    validations:
      required: true
  - type: input
    id: devtools
    attributes:
      label: 微信开发者工具版本
  - type: input
    id: os
    attributes:
      label: 操作系统
  - type: dropdown
    id: environment
    attributes:
      label: 出现问题的环境
      options:
        - 开发者工具
        - 预览或体验版
        - 真机正式版
        - 云函数或云数据库
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有发现重复报告。
          required: true
        - label: 我已删除日志和截图中的敏感信息。
          required: true
