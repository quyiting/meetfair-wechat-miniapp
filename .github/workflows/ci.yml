name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        run: find miniprogram cloudfunctions tests -name '*.js' -print0 | xargs -0 -n1 node --check
